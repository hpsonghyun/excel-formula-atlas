name: Feature request
description: Suggest a change that makes a workbook easier to understand or navigate.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: What workbook task are you trying to do?
      description: Describe the situation and the outcome you need. Focus on the user's task before proposing a control or feature.
      placeholder: I need to understand where several neighboring totals get their inputs...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What gets in the way today?
      description: Explain what you tried in Excel Formula Atlas and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe the change and how it would help. A small fictional example is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention another workflow or simpler change that could solve the same problem, if applicable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Shared data
      options:
        - label: Any examples or attachments contain only fictional or anonymized data.
          required: true
